cargoCachePath: ""

gha-runner-scale-set:
  githubConfigUrl: ""
  githubConfigSecret: github-secret
  minRunners: 0
  maxRunners: 0
  template:
    spec:
      containers:
      - name: runner
        volumeMounts:
        - name: cargo-cache
          mountPath: /usr/local/cargo/registry
      volumes:
      - name: cargo-cache
        hostPath:
          path: ""
          type: DirectoryOrCreate
